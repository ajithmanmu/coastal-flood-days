name: deploy

# Push to main publishes the page. The dataset is not touched: results/ is owned by the
# daily Lambda and raw/ by the backfill, and the CI role cannot write either.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "deploy.sh"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Least privilege: `id-token` is what lets the job request an OIDC token; `contents: read`
# is all it needs besides. No AWS keys are stored in this repository.
permissions:
  id-token: write
  contents: read

# A second push while one deploy is running should supersede it, not race it into the
# same bucket. Never cancel in progress -- a half-finished asset sync would leave the
# page referencing files that are not there yet.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # No `environment:` block here on purpose. Declaring one rewrites the OIDC subject
    # claim from `repo:OWNER/REPO:ref:refs/heads/main` to `repo:OWNER/REPO:environment:NAME`,
    # which stops matching the trust policy. Widening the policy to accept the environment
    # subject would let a workflow on any branch assume the role, so the branch pin wins.
    env:
      CI: "true"
      DISTRIBUTION_ID: E1WGHQRL9XD896
      AWS_REGION: us-east-1

    steps:
      - uses: actions/checkout@v4

      # TEMPORARY: prints the identity claims only (never the token or signature) so the
      # trust policy can be matched against what GitHub actually sends.
      - name: Debug OIDC claims
        run: |
          set -euo pipefail
          VALUE=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")
          python3 - "$VALUE" <<'PY'
          import base64, json, sys
          part = sys.argv[1].split('.')[1]
          part += '=' * (-len(part) % 4)
          claims = json.loads(base64.urlsafe_b64decode(part))
          keep = ("sub", "aud", "repository", "ref", "event_name", "workflow_ref", "iss")
          print(json.dumps({k: claims[k] for k in keep if k in claims}, indent=1))
          PY

      - name: Assume deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::412602263780:role/coastal-flood-days-github-deploy
          aws-region: us-east-1

      - name: Publish
        run: ./deploy.sh

      - name: Verify the page is live and the archive is not
        run: |
          set -euo pipefail
          U=https://d39egagpmdjbzd.cloudfront.net

          # CloudFront serves the previous object until the invalidation lands, so retry
          # rather than asserting immediately.
          for i in $(seq 1 20); do
            if curl -sf "$U/vendor/maplibre-gl.mjs" -o /dev/null; then break; fi
            echo "waiting for edge ($i/20)"; sleep 15
          done

          echo "--- assets must be reachable ---"
          for p in /index.html /vendor/maplibre-gl.mjs /vendor/pmtiles.js /results/map_summary.json; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$U$p")
            echo "  $p -> $code"
            [ "$code" = "200" ] || { echo "FAIL: $p returned $code"; exit 1; }
          done

          echo "--- range requests must still work ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' -r 0-15 "$U/basemap/protomaps-20260820.pmtiles")
          echo "  basemap range -> $code"
          [ "$code" = "206" ] || { echo "FAIL: expected 206, got $code"; exit 1; }

          # The check that matters. A wildcard in the bucket policy once made the entire
          # 736 MB raw archive publicly downloadable through CloudFront, and every
          # positive test still passed. Assert the negative case on every deploy.
          echo "--- raw archive must stay private ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$U/raw/station=8518750/year=2020/data.parquet")
          echo "  raw/ -> $code"
          [ "$code" = "403" ] || { echo "FAIL: raw archive is reachable ($code)"; exit 1; }
