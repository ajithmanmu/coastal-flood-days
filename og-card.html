<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #0d0d0d; color: #fff;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 54px 60px 46px;
  }
  .eyebrow { color: #898781; font-size: 19px; letter-spacing: .07em; text-transform: uppercase; }
  h1 { font-size: 62px; line-height: 1.08; letter-spacing: -.025em; max-width: 19ch; margin-top: 22px; }
  h1 em { font-style: normal; color: #fd9e4f; }
  .stats { display: flex; gap: 54px; margin-top: 8px; }
  .stat .v { font-size: 40px; letter-spacing: -.02em; line-height: 1; }
  .stat .k { color: #898781; font-size: 17px; margin-top: 8px; }
  .foot { display: flex; justify-content: space-between; align-items: flex-end; color: #898781; font-size: 19px; }
  .dots { position: absolute; right: 60px; top: 96px; width: 420px; height: 260px; }
</style>
<body>
  <div>
    <div class="eyebrow">137 US tide gauges · 1920–2026</div>
    <h1>Coastal floods come far more often. They <em>don't last longer</em>.</h1>
  </div>

  <div class="stats">
    <div class="stat"><div class="v">73 of 86</div><div class="k">gauges flooding more often</div></div>
    <div class="stat"><div class="v">1.95 → 1.97 hrs</div><div class="k">typical flood, then and now</div></div>
    <div class="stat"><div class="v">6,848</div><div class="k">station-years computed</div></div>
  </div>

  <div class="foot">
    <span>floodhours.ajithmanmadhan.com</span>
    <span>Measured from raw NOAA hourly observations</span>
  </div>
</body>
